<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />

  <!-- Modern Glowing Blobs / Orbs -->
  <circle cx="1050" cy="70" r="130" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />
  <circle cx="100" cy="230" r="150" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="150" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />

  <!-- Main Glassmorphism Card -->
  <rect x="80" y="45" width="1040" height="210" rx="20" fill="#030712" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" />
  
  <!-- Inner Highlight Box (Diperlebar agar muat) -->
  <rect x="110" y="75" width="450" height="150" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="1" />

  <!-- Decorative Status Indicator Dot -->
  <circle cx="138" cy="108" r="6" fill="#10b981" />
  <text x="155" y="113" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AVAILABLE FOR PROJECTS</text>

  <!-- Main Name Text (Ukuran font dikecilkan sedikit dari 32 ke 28 agar pas di dalam kotak) -->
  <text x="138" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">Muhammad Rochimuloh</text>
  
  <!-- Subtitle -->
  <text x="138" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Pelajar @lunarxoim | Coding Enthusiast</text>

  <!-- Decorative Tech Badges on the right side -->
  <g transform="translate(680, 105)">
    <!-- Badge 1: Web Dev -->
    <rect x="0" y="0" width="115" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="57" y="23" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">&lt;WebDev/&gt;</text>

    <!-- Badge 2: Student -->
    <rect x="130" y="0" width="115" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="187" y="23" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">#Student</text>

    <!-- Badge 3: Coder -->
    <rect x="260" y="0" width="105" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="312" y="23" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">☕ Code</text>

    <!-- Mini Sub-row tags -->
    <text x="0" y="65" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">⚡ Focused on building cool web experiences</text>
  </g>
</svg>
