<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495px" height="195px" fill="none">
  <style>
    .header { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #38BDF8; }
    .stat-label { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 12.5px; fill: #94A3B8; font-weight: 500; }
    .stat-val { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 12.5px; fill: #E6F7FF; font-weight: 700; }
    .lang-name { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 12px; fill: #CBD5E1; font-weight: 600; }
    .lang-pct { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 11.5px; fill: #64748B; font-weight: 600; }
  </style>

  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="38%" stop-color="#3178C6"/>
      <stop offset="38.1%" stop-color="#0175C2"/>
      <stop offset="64%" stop-color="#0175C2"/>
      <stop offset="64.1%" stop-color="#FF2D20"/>
      <stop offset="85%" stop-color="#FF2D20"/>
      <stop offset="85.1%" stop-color="#563D7C"/>
      <stop offset="100%" stop-color="#563D7C"/>
    </linearGradient>
  </defs>

  <!-- Card Background & Border -->
  <rect width="495" height="195" rx="8" fill="#000000" fill-opacity="0"/>
  <rect x="0.5" y="0.5" width="494" height="194" rx="7.5" fill="#0B132B" fill-opacity="0.35" stroke="#1E293B" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(25, 28)">
    <circle cx="6" cy="6" r="5" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="2.5" fill="#22D3EE"/>
    <text x="20" y="11" class="header">Most Used Languages</text>
  </g>

  <!-- Multi-Color Progress Bar -->
  <g transform="translate(25, 55)">
    <!-- Base background bar -->
    <rect width="445" height="9" rx="4.5" fill="#1E293B"/>
    <!-- TypeScript portion (38%) -->
    <rect x="0" y="0" width="169" height="9" rx="4.5" fill="#3178C6"/>
    <!-- Dart portion (26%) -->
    <rect x="171" y="0" width="116" height="9" fill="#0175C2"/>
    <!-- Blade/Laravel portion (21%) -->
    <rect x="289" y="0" width="93" height="9" fill="#FF2D20"/>
    <!-- CSS/Other portion (15%) -->
    <rect x="384" y="0" width="61" height="9" rx="4.5" fill="#563D7C"/>
  </g>

  <!-- Languages Legend Grid (2 rows x 2 cols) -->
  <g transform="translate(25, 85)">
    <!-- Column 1 -->
    <!-- TypeScript -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#3178C6"/>
      <text x="18" y="9" class="lang-name">TypeScript</text>
      <text x="100" y="9" class="lang-pct">38.0%</text>
    </g>
    <!-- Laravel / Blade -->
    <g transform="translate(0, 26)">
      <circle cx="5" cy="5" r="4.5" fill="#FF2D20"/>
      <text x="18" y="9" class="lang-name">Blade / PHP</text>
      <text x="100" y="9" class="lang-pct">21.0%</text>
    </g>

    <!-- Column 2 -->
    <!-- Dart -->
    <g transform="translate(230, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#0175C2"/>
      <text x="18" y="9" class="lang-name">Dart / Flutter</text>
      <text x="110" y="9" class="lang-pct">26.0%</text>
    </g>
    <!-- CSS / Web -->
    <g transform="translate(230, 26)">
      <circle cx="5" cy="5" r="4.5" fill="#563D7C"/>
      <text x="18" y="9" class="lang-name">CSS / HTML</text>
      <text x="110" y="9" class="lang-pct">15.0%</text>
    </g>
  </g>

  <!-- Bottom Divider Line & Quick Profile Summary -->
  <line x1="25" y1="152" x2="470" y2="152" stroke="#1E293B" stroke-width="1"/>

  <g transform="translate(25, 172)">
    <text x="0" y="0" class="stat-label">Active Repositories: <tspan class="stat-val">8 Public</tspan></text>
    <text x="230" y="0" class="stat-label">Primary Stack: <tspan class="stat-val">TypeScript &amp; Dart</tspan></text>
  </g>

</svg>
