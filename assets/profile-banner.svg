<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Rochimuloh Profile Banner</title>
  <desc id="desc">Modern high-tech glassmorphic profile banner for Muhammad Rochimuloh with real tech stack and repository info.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="40" y1="20" x2="1240" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="35%" stop-color="#09182E"/>
      <stop offset="70%" stop-color="#0A243F"/>
      <stop offset="100%" stop-color="#061A28"/>
    </linearGradient>

    <!-- Glass Panel Gradients -->
    <linearGradient id="mainCard" x1="70" y1="45" x2="710" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.48"/>
    </linearGradient>

    <linearGradient id="mainCardStroke" x1="70" y1="45" x2="710" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="codeCard" x1="740" y1="45" x2="1210" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.82"/>
    </linearGradient>

    <linearGradient id="codeCardStroke" x1="740" y1="45" x2="1210" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pill Tag Gradient -->
    <linearGradient id="tagFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Ambient Glowing Orbs -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 80) rotate(45) scale(340 240)">
      <stop stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 120) rotate(135) scale(400 280)">
      <stop stop-color="#818CF8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 330) rotate(-90) scale(220 420)">
      <stop stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Poppins', 'Montserrat', 'Segoe UI', system-ui, sans-serif; font-weight: 700; }
    .font-sub { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <!-- Ambient Glows -->
  <circle cx="220" cy="80" r="230" fill="url(#glowLeft)"/>
  <circle cx="1040" cy="120" r="270" fill="url(#glowRight)"/>
  <circle cx="640" cy="330" r="250" fill="url(#glowBottom)"/>

  <!-- Decorative Tech Grid in Background -->
  <g opacity="0.14">
    <path d="M40 90H1240M40 180H1240M40 270H1240" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M200 40V320M400 40V320M600 40V320M800 40V320M1000 40V320" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Glowing background curved accents -->
  <path d="M760 60C900 70 1070 130 1220 240" stroke="url(#cyanLine)" stroke-opacity="0.25" stroke-width="2" fill="none"/>
  <path d="M820 300C950 280 1100 210 1240 100" stroke="url(#cyanLine)" stroke-opacity="0.18" stroke-width="1.5" fill="none"/>

  <!-- OUTER BORDER FRAME -->
  <rect x="40" y="30" width="1200" height="300" rx="24" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- ================= LEFT HERO CARD ================= -->
  <g filter="url(#softShadow)">
    <rect x="65" y="48" width="655" height="264" rx="20" fill="url(#mainCard)"/>
    <rect x="65.5" y="48.5" width="654" height="263" rx="19.5" stroke="url(#mainCardStroke)" stroke-width="1.5"/>

    <!-- Gradient Accent Top Bar -->
    <rect x="95" y="78" width="130" height="5" rx="2.5" fill="url(#cyanLine)"/>
    <circle cx="245" cy="80.5" r="3" fill="#38BDF8"/>
    <circle cx="258" cy="80.5" r="3" fill="#818CF8"/>
    <circle cx="271" cy="80.5" r="3" fill="#34D399"/>

    <!-- Status Badge -->
    <g transform="translate(95, 98)">
      <rect width="180" height="26" rx="13" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.35"/>
      <circle cx="14" cy="13" r="4.5" fill="#10B981" filter="url(#glowFilter)"/>
      <text x="27" y="17" fill="#34D399" class="font-mono" font-size="11" font-weight="600" letter-spacing="1">CODING ENTHUSIAST</text>
    </g>

    <!-- Main Profile Name -->
    <text x="95" y="168" fill="#FFFFFF" class="font-title" font-size="37" letter-spacing="0.2">
      Muhammad Rochimuloh
    </text>

    <!-- Subtitle / Bio -->
    <text x="96" y="202" fill="#93C5FD" class="font-sub" font-size="16.5" font-weight="500">
      Web &amp; Mobile Developer <tspan fill="#60A5FA" font-weight="700">·</tspan> Student @lunarxoim
    </text>

    <!-- Tech Stack Pill Badges (TypeScript, Dart, Laravel, PHP, MySQL) -->
    <g transform="translate(95, 226)">
      
      <!-- Badge 1: TypeScript -->
      <g>
        <rect x="0" y="0" width="116" height="38" rx="19" fill="url(#tagFill)" stroke="white" stroke-opacity="0.15"/>
        <g transform="translate(12, 10)">
          <!-- TS Logo Icon -->
          <rect width="18" height="18" rx="3.5" fill="#3178C6"/>
          <text x="9" y="13.5" fill="#FFFFFF" class="font-mono" font-size="10" font-weight="900" text-anchor="middle">TS</text>
        </g>
        <text x="37" y="24" fill="#F8FAFC" class="font-sub" font-size="13" font-weight="600">TypeScript</text>
      </g>

      <!-- Badge 2: Dart -->
      <g transform="translate(124, 0)">
        <rect x="0" y="0" width="86" height="38" rx="19" fill="url(#tagFill)" stroke="white" stroke-opacity="0.15"/>
        <g transform="translate(12, 10)">
          <!-- Dart Logo Icon -->
          <path d="M0 4.5L9 0L17 5L17 13.5L8 18L0 13.5Z" fill="#0175C2"/>
          <path d="M5 6L14 3L14 12L7 14.5Z" fill="#02569B"/>
          <path d="M1 9.5L8 14L15 9.5L12 7.5L8 10L3 7Z" fill="#29B6F6"/>
        </g>
        <text x="36" y="24" fill="#F8FAFC" class="font-sub" font-size="13" font-weight="600">Dart</text>
      </g>

      <!-- Badge 3: Laravel -->
      <g transform="translate(218, 0)">
        <rect x="0" y="0" width="102" height="38" rx="19" fill="url(#tagFill)" stroke="white" stroke-opacity="0.15"/>
        <g transform="translate(12, 10)">
          <!-- Laravel Vector Icon -->
          <path d="M9 1.5L1.5 5.5L9 9.5L16.5 5.5L9 1.5Z" fill="none" stroke="#FF2D20" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M1.5 5.5V12.5L9 16.5V9.5" fill="none" stroke="#FF2D20" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M16.5 5.5V12.5L9 16.5" fill="none" stroke="#FF2D20" stroke-width="1.6" stroke-linejoin="round"/>
        </g>
        <text x="36" y="24" fill="#F8FAFC" class="font-sub" font-size="13" font-weight="600">Laravel</text>
      </g>

      <!-- Badge 4: PHP -->
      <g transform="translate(328, 0)">
        <rect x="0" y="0" width="84" height="38" rx="19" fill="url(#tagFill)" stroke="white" stroke-opacity="0.15"/>
        <g transform="translate(12, 10)">
          <!-- PHP Logo Icon -->
          <rect width="20" height="18" rx="4" fill="#777BB4"/>
          <text x="10" y="13" fill="#FFFFFF" class="font-mono" font-size="8.5" font-weight="900" text-anchor="middle">PHP</text>
        </g>
        <text x="37" y="24" fill="#F8FAFC" class="font-sub" font-size="13" font-weight="600">PHP</text>
      </g>

      <!-- Badge 5: MySQL -->
      <g transform="translate(420, 0)">
        <rect x="0" y="0" width="94" height="38" rx="19" fill="url(#tagFill)" stroke="white" stroke-opacity="0.15"/>
        <g transform="translate(12, 10)">
          <!-- DB / MySQL Icon -->
          <ellipse cx="9" cy="4.5" rx="7.5" ry="3" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
          <path d="M1.5 4.5V13.5C1.5 15.15 4.85 16.5 9 16.5C13.15 16.5 16.5 15.15 16.5 13.5V4.5" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
          <path d="M1.5 9C1.5 10.65 4.85 12 9 12C13.15 12 16.5 10.65 16.5 9" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
        </g>
        <text x="35" y="24" fill="#F8FAFC" class="font-sub" font-size="13" font-weight="600">MySQL</text>
      </g>

    </g>
  </g>

  <!-- ================= RIGHT VISUAL / CODE WINDOW ================= -->
  <g filter="url(#softShadow)" transform="translate(740, 48)">
    <!-- Terminal Box Frame -->
    <rect width="475" height="264" rx="20" fill="url(#codeCard)"/>
    <rect x="0.5" y="0.5" width="474" height="263" rx="19.5" stroke="url(#codeCardStroke)" stroke-width="1.2"/>

    <!-- Terminal Header -->
    <path d="M0 20C0 8.95431 8.95431 0 20 0H455C466.046 0 475 8.95431 475 20V42H0V20Z" fill="#0B132B" fill-opacity="0.6"/>
    <line x1="0" y1="42" x2="475" y2="42" stroke="white" stroke-opacity="0.08"/>

    <!-- Window Dots -->
    <circle cx="22" cy="21" r="5.5" fill="#EF4444" fill-opacity="0.9"/>
    <circle cx="39" cy="21" r="5.5" fill="#F59E0B" fill-opacity="0.9"/>
    <circle cx="56" cy="21" r="5.5" fill="#10B981" fill-opacity="0.9"/>

    <!-- Window Title -->
    <text x="237" y="26" fill="#94A3B8" class="font-mono" font-size="12" font-weight="500" text-anchor="middle">
      ~/oimcuyyy/profile.ts
    </text>

    <!-- Terminal Code Body -->
    <g transform="translate(24, 68)" class="font-mono" font-size="12.2" letter-spacing="0.25">
      <!-- Line 1 -->
      <text y="0">
        <tspan fill="#C084FC" font-weight="600">const</tspan> <tspan fill="#67E8F9">developer</tspan> <tspan fill="#94A3B8">=</tspan> <tspan fill="#F8FAFC">{</tspan>
      </text>

      <!-- Line 2 -->
      <text y="22">
        <tspan fill="#94A3B8">  name:</tspan> <tspan fill="#86EFAC">"Muhammad Rochimuloh"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 3 -->
      <text y="44">
        <tspan fill="#94A3B8">  handle:</tspan> <tspan fill="#86EFAC">"@oimcuyyy"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 4 -->
      <text y="66">
        <tspan fill="#94A3B8">  role:</tspan> <tspan fill="#86EFAC">"Web &amp; Mobile Developer"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 5 -->
      <text y="88">
        <tspan fill="#94A3B8">  stack:</tspan> <tspan fill="#F8FAFC">[</tspan><tspan fill="#93C5FD">"TypeScript"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#67E8F9">"Dart"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FCA5A5">"Laravel"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#C4B5FD">"Blade"</tspan><tspan fill="#F8FAFC">]</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 6 -->
      <text y="110">
        <tspan fill="#94A3B8">  projects:</tspan> <tspan fill="#F8FAFC">[</tspan><tspan fill="#FDE047">"portofolio.app"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#6EE7B7">"project_pos"</tspan><tspan fill="#F8FAFC">]</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 7 -->
      <text y="132">
        <tspan fill="#94A3B8">  passion:</tspan> <tspan fill="#86EFAC">"Building High-Quality Apps 🚀"</tspan>
      </text>

      <!-- Line 8 -->
      <text y="152">
        <tspan fill="#F8FAFC">};</tspan>
      </text>

      <!-- Line 9 / Interactive prompt cursor -->
      <text y="176">
        <tspan fill="#34D399" font-weight="700">➜</tspan> <tspan fill="#38BDF8">~/github</tspan> <tspan fill="#E2E8F0">git status</tspan> <tspan fill="#34D399">✔ clean</tspan>
      </text>
    </g>

    <!-- Floating Mini Glass Pill on Code Card -->
    <g transform="translate(340, 204)">
      <rect width="112" height="32" rx="16" fill="#0E233D" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="15" cy="16" r="3.5" fill="#38BDF8"/>
      <text x="26" y="20.5" fill="#E0F2FE" class="font-mono" font-size="10.5" font-weight="600">TypeScript / Dart</text>
    </g>
  </g>

</svg>
