<svg width="1280" height="86" viewBox="0 0 1280 86" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Profile Footer</title>
  <desc id="footerDesc">Modern glassmorphic profile footer for Muhammad Rochimuloh with active status and location details.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0" y1="0" x2="1280" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="40%" stop-color="#09182E"/>
      <stop offset="70%" stop-color="#0A243F"/>
      <stop offset="100%" stop-color="#061A28"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footerStroke" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Accent Top Line -->
    <linearGradient id="accentLine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="glowFooter" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 43) scale(400 60)">
      <stop stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="1279" height="85" rx="18" fill="url(#footerBg)"/>
  <rect x="0.5" y="0.5" width="1279" height="85" rx="18" fill="url(#glowFooter)"/>
  <rect x="0.5" y="0.5" width="1279" height="85" rx="18" stroke="url(#footerStroke)" stroke-width="1.2"/>

  <!-- Accent Top Border Highlight -->
  <path d="M18 1H1262" stroke="url(#accentLine)" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Content: Status & Location -->
  <g transform="translate(36, 26)">
    <!-- Ping Dot -->
    <circle cx="6" cy="6" r="7" fill="#10B981" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="3.5" fill="#10B981"/>
    
    <text x="24" y="10" fill="#34D399" class="mono" font-size="11.5" font-weight="600" letter-spacing="0.8">AVAILABLE FOR COLLABORATION</text>
    <text x="24" y="32" fill="#94A3B8" class="sans" font-size="13" font-weight="500">Software Engineering @lunarxoim <tspan fill="#64748B">·</tspan> Jakarta, Indonesia</text>
  </g>

  <!-- Right Content: Terminal Prompt & Credits -->
  <g transform="translate(1244, 26)">
    <text x="0" y="10" class="mono" font-size="12" font-weight="600" text-anchor="end">
      <tspan fill="#34D399">➜</tspan> <tspan fill="#38BDF8">~/oimcuyyy</tspan> <tspan fill="#E2E8F0">exit</tspan> <tspan fill="#818CF8">0</tspan>
    </text>
    <text x="0" y="32" fill="#64748B" class="sans" font-size="12.5" font-weight="500" text-anchor="end">
      Crafted with precision <tspan fill="#475569">·</tspan> TypeScript, Dart &amp; Laravel
    </text>
  </g>
</svg>
